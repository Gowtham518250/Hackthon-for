services:
  - type: web
    name: deepsearch-api
    runtime: python
    region: singapore
    plan: 1c-2g
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: deepsearch-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/storage
      - key: UPLOAD_DIR
        value: /tmp/deepsearch
      - key: EMBEDDING_MODEL_REPO
        value: Xenova/all-MiniLM-L6-v2
      - key: DEBUG
        value: "false"
