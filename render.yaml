services:
  - type: web
    name: deepsearch-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: HF_HOME
        value: /tmp/.cache/huggingface
      - key: DATABASE_URL
        fromDatabase:
          name: deepsearch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: deepsearch-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: FRONTEND_ORIGIN
        value: https://hackthon-for.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/deepsearch/storage
      - key: UPLOAD_DIR
        value: /tmp/deepsearch
      - key: EMBEDDING_MODEL_REPO
        value: Xenova/all-MiniLM-L6-v2
      - key: HF_HOME
        value: /tmp/.cache/huggingface
      - key: DEBUG
        value: "false"

  - type: keyvalue
    name: deepsearch-redis
    region: singapore
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: deepsearch-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://deepsearch-api.onrender.com

databases:
  - name: deepsearch-db
    region: singapore
    plan: free
    databaseName: deepsearch
